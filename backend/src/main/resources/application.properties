spring.application.name=alocar

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alocar}
spring.datasource.username=${DB_USER:alocar}
spring.datasource.password=${DB_PASSWORD:alocar}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Franchise settings until franchises are stored in the database. Values are «proposta».
alocar.time-zone=Europe/Lisbon
alocar.pricing.rate-per-minute-cents=5
alocar.pricing.fine-per-late-minute-cents=20
alocar.pricing.fine-threshold=10m
alocar.pricing.min-duration-minutes=10
alocar.pricing.max-duration-minutes=480
