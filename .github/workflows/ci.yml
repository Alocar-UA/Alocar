name: CI

# CI on every push and on every pull request to main (practice D2), plus manual runs.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch or PR cancels the run still going for the old commit.
# Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for SonarQube new-code detection
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, unit and integration tests, coverage
        run: ./mvnw -B verify
      # Sends the test results to Xray: one Test Execution per run in Jira project SCRUM,
      # added to the Test Plan in the repository variable XRAY_TEST_PLAN_KEY (none when unset).
      # Runs for pull requests and main only (not for every branch push), even when tests fail;
      # skipped when the Xray secrets are unavailable (e.g. Dependabot PRs). Reporting to Jira
      # must not block merges, so an import error shows as a warning instead of failing the build.
      - name: Import test results into Xray
        continue-on-error: true
        if: >-
          always()
          && env.XRAY_CLIENT_ID != ''
          && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
          && hashFiles('backend/target/xray-reports/*.xml') != ''
        uses: mikepenz/xray-action@v4
        with:
          username: ${{ secrets.XRAY_CLIENT_ID }}
          password: ${{ secrets.XRAY_CLIENT_SECRET }}
          xrayCloud: 'true'
          testFormat: junit
          testPaths: backend/target/xray-reports/*.xml
          projectKey: SCRUM
          testPlanKey: ${{ vars.XRAY_TEST_PLAN_KEY }}
          combineInSingleTestExec: 'true'
          failOnImportError: 'true'
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
      - name: Upload acceptance test reports (Cucumber)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-reports
          path: backend/target/cucumber-reports/
          if-no-files-found: ignore
      # TODO: remove this condition once SonarCloud is set up, so a missing token fails the build.
      # Pull requests and main only: the SonarQube Cloud free plan cannot report the quality
      # gate of other branches ("not allowed to access data from non main branches").
      - name: SonarQube analysis and quality gate
        if: >-
          env.SONAR_TOKEN != '' &&
          (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        run: >
          ./mvnw -B sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.qualitygate.wait=true
      - name: Warn when the quality gate was skipped
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN is not set; SonarQube analysis and quality gate were skipped."

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan backend and frontend dependencies for known vulnerabilities (OSV)
        run: >
          docker run --rm -v "$PWD":/src:ro ghcr.io/google/osv-scanner:v2.7.0
          scan source --recursive /src/backend /src/frontend

  smoke-test:
    name: smoke-test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose up --build -d --wait
      - name: API is reachable through the frontend proxy
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost/api/v1/hubs && exit 0
            sleep 2
          done
          docker compose logs backend
          exit 1
      - name: Stop the stack
        if: always()
        run: docker compose down -v
